name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Push images
        run: docker compose -f docker-compose.prod.yml push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ssh and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker pull ghcr.io/amorina1/flask-api:latest
            docker pull ghcr.io/amorina1/react-client:latest
            docker stop api || true
            docker rm api || true
            docker run -d --name api -p 5000:5000 ghcr.io/amorina1/flask-api:latest
            docker stop client || true
            docker rm client || true
            docker run -d --name client -p 80:3000 ghcr.io/amorina1/react-client:latest
            
            
